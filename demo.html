<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Drip Advisor – Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1a1c1f, #0d0f13);
      color: #0fc7ff;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      max-width: 1100px;
      width: 100%;
      padding: 16px;
      box-sizing: border-box;
    }

    h1, h2, h3 {
      margin: 0 0 8px;
    }

    .card {
      background: #151521;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      background: #1f2937;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      opacity: 0.9;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #d1d5db;
    }

    input, select, button, textarea {
      font-family: inherit;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0f172a;
      color: #f9fafb;
      box-sizing: border-box;
      margin-bottom: 8px;
      outline: none;
    }

    input[type="file"] {
      margin-bottom: 8px;
    }

    textarea {
      min-height: 60px;
      resize: vertical;
    }

    button {
      border-radius: 999px;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 500;
      background: #2eb1f2;
      color: white;
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
      opacity: 0.95;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .btn-secondary {
      background: #111827;
      border: 1px solid #374151;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .col-half {
      flex: 1 1 260px;
    }

    .status {
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
    }

    .status.ok {
      color: #22c55e;
    }

    .status.err {
      color: #f97316;
    }

    /* CUSTOM FILE UPLOAD BUTTON */
    .custom-file {
      position: relative;
      display: inline-block;
    }
    
    #uploadImage {
      width: 0.1px;
      height: 0.1px;
      opacity: 0;
      overflow: hidden;
      position: absolute;
      z-index: -1;
    }
    
    .custom-file-label {
      display: inline-block;
      padding: 8px 25px;       /* BUTTON SIZE */
      background: #2eb1f2;      /* BUTTON COLOR */
      color: white;             /* TEXT COLOR */
      border-radius: 12px;      /* CORNER CURVE */
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    
    .custom-file-label:hover {
      background: #1ba0df;      /* HOVER COLOR */
      transform: translateY(-1px);
    }


    .hidden {
      display: none !important;
    }

    /* wardrobe */
    .wardrobe-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .wardrobe-item {
      width: 120px;
      background: #0b1120;
      border-radius: 12px;
      padding: 6px;
      box-sizing: border-box;
      font-size: 11px;
      border: 1px solid #1f2937;
    }

    .wardrobe-item img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 4px;
    }

    .wardrobe-tags {
      color: #9ca3af;
      font-size: 10px;
    }

    /* chat */
    .chat-container {
      max-height: 330px;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid #111827;
      padding: 8px;
      background: #020617;
      box-sizing: border-box;
    }

    .msg {
      margin: 6px 0;
      display: flex;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .msg.bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #0fc7ff;
      color: #f9fafb;
      border-bottom-right-radius: 2px;
    }

    .bot .bubble {
      background: #111827;
      color: #e5e7eb;
      border-bottom-left-radius: 2px;
    }

    .msg-meta {
      font-size: 10px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .chat-input-row textarea {
      flex: 1 1 auto;
      margin-bottom: 0;
    }

    /* top bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .topbar-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
    }

    /* LOGIN PAGE LAYOUT (image + form) */
    .layout {
      display: flex;
      gap: 24px;
      margin-top: 12px;
      align-items: center;
    }

    .layout-left,
    .layout-right {
      flex: 1 1 0;
    }

    .preview-box {
      background: #050816;
      border-radius: 24px;
      min-height: 450px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .preview-text {
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      color: #22d3ee;
    }

    .preview-text span {
      display: block;
      font-size: 14px;
      color: #e5e7eb;
    }

    .preview-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }
      .preview-box {
        min-height: 260px;
      }
    }

    @media (max-width: 720px) {
      .card {
        border-radius: 12px;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
  <div></div>  <!-- left side empty now -->
  <div>
    <span class="chip" id="userChip">Not logged in</span>
    <button id="btnLogout" class="btn-secondary"
            style="margin-left:10px;padding:4px 12px;font-size:12px;display:none;">
      Logout
    </button>
  </div>
</div>
  <!-- AUTH LAYOUT: IMAGE (LEFT) + LOGIN CARD (RIGHT) -->
    <!-- AUTH LAYOUT: IMAGE (LEFT) + LOGIN CARD (RIGHT) -->
  <div id="authLayout" class="layout">

    <!-- LEFT: image / illustration -->
    <div class="layout-left">
      <div class="preview-box">
        <img src="drippng.png" class="preview-image" alt="App Preview">
      </div>
    </div>

    <!-- RIGHT: login / register card -->
    <div class="layout-right">
      <div class="card" id="authCard">
        <div class="card-header">
          <h2>1. Login / Registration</h2>
        </div>

        <div class="row">
          <div class="col-half">
            <h3 style="font-size: 15px;">New here? Register</h3>
            <label for="regName">Name</label>
            <input id="regName" type="text" placeholder="Aanya" />
            <label for="regEmail">Email</label>
            <input id="regEmail" type="email" placeholder="you@example.com" />
            <label for="regPassword">Password</label>
            <input id="regPassword" type="password" placeholder="●●●●●●●" />
            <button id="btnRegister">Register</button>
            <div class="status" id="regStatus"></div>
          </div>

          <div class="col-half">
            <h3 style="font-size: 15px;">Already registered? Login</h3>
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" placeholder="you@example.com" />
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="●●●●●●●" />
            <button id="btnLogin">Login</button>
            <div class="status" id="loginStatus"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- end authLayout -->


  <!-- MAIN APP (FULL WIDTH, NO IMAGE) -->
  <div id="mainApp" class="hidden">
    <!-- UPLOAD + WARDROBE -->
    <div class="card">
      <div class="card-header">
        <h2>2. Upload outfits to your wardrobe</h2>
      </div>

      <div class="row">
        <div class="col-half">
          <label for="uploadImage">Choose outfit image</label>
         <div class="custom-file">
          <label for="uploadImage" class="custom-file-label">Choose File</label>
          <input id="uploadImage" type="file" accept="image/*" />
      </div>
          
          <label for="uploadCategory">Category</label>
          <select id="uploadCategory">
            <option value="casual">Casual</option>
            <option value="formal">Formal</option>
            <option value="seasonal">Seasonal</option>
          </select>

          <label for="uploadColor">Colour (optional, e.g. red / blue)</label>
          <input id="uploadColor" type="text" placeholder="red, black, blue..." />

          <label for="uploadSeason">Season (optional, e.g. winter / summer)</label>
          <input id="uploadSeason" type="text" placeholder="winter, monsoon, summer..." />

          <button id="btnAddItem">Add to Wardrobe</button>
          <div class="status" id="uploadStatus"></div>
        </div>

        <div class="col-half">
          <h3 style="font-size: 15px;">Your Wardrobe</h3>
          <div id="wardrobeEmpty" style="font-size: 13px; color:#9ca3af;">
            No items yet. Upload a few outfits to see them here.
          </div>
          <div class="wardrobe-grid" id="wardrobeGrid"></div>
        </div>
      </div>
    </div>

    <!-- CHATBOT -->
    <div class="card">
      <div class="card-header">
        <h2>3. Chatbot – outfit suggestions</h2>
      </div>

      <div class="chat-container" id="chatContainer">
        <!-- messages will be appended here -->
      </div>

      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Try: ‘Suggest a casual outfit’ or ‘Outfit with red colour’"></textarea>
        <button id="btnSend">Send</button>
      </div>
      <!--<div style="font-size:11px; color:#9ca3af; margin-top:4px;">
        Demo logic runs fully in the browser. In the actual system, this would call the Flask + Gemini backend.
      </div>-->
    </div>
  </div> <!-- end mainApp -->

</div> <!-- end app -->

<script>
/* ---------------------------------------------------------
   USER + DATA STORAGE
--------------------------------------------------------- */
const LS_USER_DB   = "dripUsersDB";         // stores all users
const LS_ACTIVE    = "dripActiveUser";      // stores current logged-in user email
const LS_WARDROBE  = "wardrobe_";           // wardrobe per user
const LS_HISTORY   = "history_";            // outfit history per user

let currentUser = null;
let wardrobe = [];
let outfitHistory = [];

/* ---------------------------------------------------------
   LOAD ACTIVE USER + THEIR DATA
--------------------------------------------------------- */
function loadActiveUser() {
  const email = localStorage.getItem(LS_ACTIVE);
  if (!email) return;

  const allUsers = JSON.parse(localStorage.getItem(LS_USER_DB) || "[]");
  currentUser = allUsers.find(u => u.email === email);

  if (currentUser) {
    wardrobe = JSON.parse(localStorage.getItem(LS_WARDROBE + email) || "[]");
    outfitHistory = JSON.parse(localStorage.getItem(LS_HISTORY + email) || "[]");
  }
}

/* ---------------------------------------------------------
   SAVE DATA FOR CURRENT USER
--------------------------------------------------------- */
function saveUserData() {
  if (!currentUser) return;
  const email = currentUser.email;

  localStorage.setItem(LS_WARDROBE + email, JSON.stringify(wardrobe));
  localStorage.setItem(LS_HISTORY + email, JSON.stringify(outfitHistory));
}

/* ---------------------------------------------------------
   UPDATE UI BASED ON LOGIN STATE
--------------------------------------------------------- */
function refreshAuthUI() {
  if (currentUser) {
    userChip.textContent = "Logged in as " + currentUser.name;
    authLayout.classList.add("hidden");
    mainApp.classList.remove("hidden");
    btnLogout.style.display = "inline-block";
  } else {
    userChip.textContent = "Not logged in";
    authLayout.classList.remove("hidden");
    mainApp.classList.add("hidden");
    btnLogout.style.display = "none";
  }
}

loadActiveUser();
refreshAuthUI();

/* ---------------------------------------------------------
   REGISTER USER
--------------------------------------------------------- */
btnRegister.addEventListener("click", () => {
  const name = regName.value.trim();
  const email = regEmail.value.trim();
  const password = regPassword.value.trim();

  regStatus.textContent = "";
  regStatus.className = "status";

  if (!name || !email || !password) {
    regStatus.textContent = "Please fill all fields.";
    regStatus.classList.add("err");
    return;
  }

  let users = JSON.parse(localStorage.getItem(LS_USER_DB) || "[]");

  if (users.some(u => u.email === email)) {
    regStatus.textContent = "User already exists.";
    regStatus.classList.add("err");
    return;
  }

  users.push({ name, email, password });
  localStorage.setItem(LS_USER_DB, JSON.stringify(users));
  localStorage.setItem(LS_ACTIVE, email);

  currentUser = { name, email, password };
  wardrobe = [];
  outfitHistory = [];

  saveUserData();
  refreshAuthUI();

  regStatus.textContent = "Registered and logged in!";
  regStatus.classList.add("ok");
});

/* ---------------------------------------------------------
   LOGIN USER
--------------------------------------------------------- */
btnLogin.addEventListener("click", () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value.trim();

  loginStatus.textContent = "";
  loginStatus.className = "status";

  let users = JSON.parse(localStorage.getItem(LS_USER_DB) || "[]");
  const found = users.find(u => u.email === email && u.password === password);

  if (!found) {
    loginStatus.textContent = "Invalid email or password.";
    loginStatus.classList.add("err");
    return;
  }

  currentUser = found;
  localStorage.setItem(LS_ACTIVE, email);

  wardrobe = JSON.parse(localStorage.getItem(LS_WARDROBE + email) || "[]");
  outfitHistory = JSON.parse(localStorage.getItem(LS_HISTORY + email) || "[]");

  refreshAuthUI();
  loginStatus.textContent = "Login successful.";
  loginStatus.classList.add("ok");
});

/* ---------------------------------------------------------
   LOGOUT USER
--------------------------------------------------------- */
btnLogout.addEventListener("click", () => {
  localStorage.removeItem(LS_ACTIVE);
  currentUser = null;
  wardrobe = [];
  outfitHistory = [];

  refreshAuthUI();
  chatContainer.innerHTML = "";
  appendMessage("bot", greetingMessage());
});

/* ---------------------------------------------------------
   WARDROBE DISPLAY
--------------------------------------------------------- */
function renderWardrobe() {
  wardrobeGrid.innerHTML = "";
  if (wardrobe.length === 0) {
    wardrobeEmpty.style.display = "block";
    return;
  }

  wardrobeEmpty.style.display = "none";

  wardrobe.forEach(item => {
    const div = document.createElement("div");
    div.className = "wardrobe-item";

    div.innerHTML = `
      <img src="${item.url}">
      <div>${item.category.toUpperCase()}</div>
      <div class="wardrobe-tags">
        ${item.color ? "Colour: " + item.color : ""}
        ${item.season ? " • Season: " + item.season : ""}
      </div>
    `;

    wardrobeGrid.appendChild(div);
  });
}

/* ---------------------------------------------------------
   ADD ITEM TO WARDROBE
--------------------------------------------------------- */
btnAddItem.addEventListener("click", () => {
  if (!uploadImage.files.length) {
    uploadStatus.textContent = "Please choose an image.";
    uploadStatus.classList.add("err");
    return;
  }

  const file = uploadImage.files[0];
  const url = URL.createObjectURL(file);

  const item = {
    id: Date.now(),
    url,
    category: uploadCategory.value,
    color: uploadColor.value.trim().toLowerCase(),
    season: uploadSeason.value.trim().toLowerCase()
  };

  wardrobe.push(item);
  saveUserData();
  renderWardrobe();

  uploadStatus.textContent = "Added!";
  uploadStatus.classList.add("ok");
  uploadImage.value = "";
});

/* ---------------------------------------------------------
   CHATBOT UI
--------------------------------------------------------- */
function appendMessage(role, content) {
  const row = document.createElement("div");
  row.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (typeof content === "object") {
    bubble.innerHTML = `<div>${content.text}</div>`;
    if (content.images?.length) {
      const imgRow = document.createElement("div");
      imgRow.style.display = "flex";
      imgRow.style.gap = "8px";
      imgRow.style.marginTop = "8px";
      content.images.forEach(u => {
        const i = document.createElement("img");
        i.src = u;
        i.style.width = "80px";
        i.style.height = "80px";
        i.style.objectFit = "cover";
        imgRow.appendChild(i);
      });
      bubble.appendChild(imgRow);
    }
  } else {
    bubble.textContent = content;
  }

  row.appendChild(bubble);
  chatContainer.appendChild(row);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

/* ---------------------------------------------------------
   GREETING MESSAGE
--------------------------------------------------------- */
function greetingMessage() {
  return "Hi! I’m your Drip Advisor stylist 👗✨\n" +
         "1️⃣ Register / login.\n" +
         "2️⃣ Upload outfits.\n" +
         "3️⃣ Ask for:\n" +
         "   • casual outfit\n" +
         "   • winter outfit\n" +
         "   • outfit with blue\n";
}

/* ---------------------------------------------------------
   OUTFIT SUGGESTION BUILDER
--------------------------------------------------------- */
let lastSuggestions = [];  // store suggestion set for selection

function buildOutfitReply(userText) {
  const t = userText.toLowerCase();

  // If selecting: "I pick 1"
  if (/pick|choose|select/.test(t)) {
    const num = parseInt(t.replace(/\D/g, ""));
    if (num && lastSuggestions[num - 1]) {
      const chosen = lastSuggestions[num - 1];

      outfitHistory.push({ id: chosen.id, date: Date.now() });
      saveUserData();

      return {
        text: `✔️ Outfit ${num} selected!\nI’ll avoid suggesting it for the next 14 days.`,
        images: [chosen.url]
      };
    }
  }

  if (wardrobe.length === 0) {
    return "Your wardrobe is empty. Upload items first!";
  }

  // FILTERING
  let desiredCategory = null;
  let desiredColor = null;
  let desiredSeason = null;

  if (t.includes("casual")) desiredCategory = "casual";
  if (t.includes("formal")) desiredCategory = "formal";
  if (t.includes("seasonal")) desiredCategory = "seasonal";

  if (t.includes("winter")) desiredSeason = "winter";
  if (t.includes("summer")) desiredSeason = "summer";
  if (t.includes("monsoon")) desiredSeason = "monsoon";

  ["red","blue","black","white","green","yellow","pink","brown","grey","orange","purple"]
    .forEach(c => { if (t.includes(c)) desiredColor = c; });

  let filtered = [...wardrobe];

  if (desiredCategory)
    filtered = filtered.filter(i => i.category === desiredCategory);

  if (desiredColor)
    filtered = filtered.filter(i => i.color === desiredColor);

  if (desiredSeason)
    filtered = filtered.filter(i => i.season === desiredSeason);

  // REMOVE recently worn outfits
  const now = Date.now();
  const TWO_WEEKS = 14 * 24 * 60 * 60 * 1000;

  filtered = filtered.filter(item => {
    const record = outfitHistory.find(h => h.id === item.id);
    return !record || now - record.date > TWO_WEEKS;
  });

  if (filtered.length === 0) {
    return "No suitable outfits found that aren’t recently worn.";
  }

  // TAKE UP TO 3
  lastSuggestions = filtered.slice(0, 3);

  const lines = [
    "Here are your outfit suggestions 👗✨",
    "",
    lastSuggestions.map((i, idx) =>
      `${idx + 1}️⃣ ${i.category.toUpperCase()}` +
      (i.color ? ` in ${i.color}` : "") +
      (i.season ? ` • ${i.season}` : "")
    ).join("\n"),
    "",
    "Reply with:\n• I pick 1\n• I pick 2\n• I pick 3\nTo lock today’s outfit ✔️"
  ].join("\n");

  return {
    text: lines,
    images: lastSuggestions.map(i => i.url)
  };
}

/* ---------------------------------------------------------
   CHAT INPUT PROCESSOR
--------------------------------------------------------- */
function handleSend() {
  const text = chatInput.value.trim();
  if (!text) return;

  appendMessage("user", text);
  chatInput.value = "";

  setTimeout(() => {
    const reply = buildOutfitReply(text);
    appendMessage("bot", reply);
  }, 300);
}

btnSend.addEventListener("click", handleSend);

chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

/* ---------------------------------------------------------
   INITIAL MESSAGE
--------------------------------------------------------- */
appendMessage("bot", greetingMessage());

</script>
</body>
</html>
